# Compose APENAS do backend para a VM do Google Cloud (frente dos frontends na Vercel).
# A porta 5000 fica presa no loopback (127.0.0.1) e só o nginx do host (com HTTPS)
# expõe /api e /hubs ao público. Usar junto com deploy/api-nginx.conf + certbot.
services:
  backend:
    build: ./backend
    image: teleprompt-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      # Variáveis secretas (JWT, banco, Firebase) ficam FORA do git.
      # Crie ./secrets/backend.env seguindo o modelo secrets/backend.env.example
      # e NUNCA commite esse arquivo.
      - secrets/backend.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # CORS: origens EXATAS dos 3 frontends + Next (www.zecki1.com.br) (separadas por ;).
      - Cors__Origins=https://www.zecki1.com.br;https://zecki1.com.br;https://next.teleprompt.zecki1.com.br;https://angular22.teleprompt.zecki1.com.br;https://angular17.teleprompt.zecki1.com.br
      # SQLite persistente fora do container (os dados não podem morrer em rebuild).
      - Database__Provider=Sqlite
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/teleprompt-dev.db
      # Firebase (Firestore) — importa os dados existentes no boot (idempotente).
      # A service account JSON vive em ./secrets/firebase-service-account.json (ignorada pelo git).
      - Firebase__ProjectId=teleprompt-1
      - Firebase__ServiceAccountKey=/app/secrets/firebase-service-account.json
      - Firebase__AutoImport=true
      # JWT: obrigatório e forte (>= 32 caracteres aleatórios). Nunca usar um valor
      # commitado. Defina Jwt__Key=... em secrets/backend.env.
      - Jwt__Key=${JWT_KEY:?Defina JWT_KEY no seu ambiente / secrets/backend.env}
    volumes:
      - ./secrets:/app/secrets:ro
      - ./data:/app/data