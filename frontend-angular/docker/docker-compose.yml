version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - teleprompt-network

  backend:
    image: teleprompt-backend:latest
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=Teleprompt;User Id=sa;Password=Your_password123!;TrustServerCertificate=true
      - Jwt__SecretKey=your-secret-key-change-in-production
      - Jwt__Issuer=Teleprompt
      - Jwt__Audience=Teleprompt
    depends_on:
      - sqlserver
    networks:
      - teleprompt-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_password123!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - teleprompt-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - teleprompt-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - teleprompt-network

networks:
  teleprompt-network:
    driver: bridge

volumes:
  sqlserver-data:
  grafana-data:
