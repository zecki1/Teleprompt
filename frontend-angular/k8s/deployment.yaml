apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleprompt-frontend
  namespace: teleprompt
  labels:
    app: teleprompt-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teleprompt-frontend
  template:
    metadata:
      labels:
        app: teleprompt-frontend
    spec:
      containers:
        - name: frontend
          image: teleprompt-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: NODE_ENV
              value: production
---
apiVersion: v1
kind: Service
metadata:
  name: teleprompt-frontend-service
  namespace: teleprompt
spec:
  selector:
    app: teleprompt-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teleprompt-frontend-ingress
  namespace: teleprompt
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - teleprompt.example.com
      secretName: teleprompt-tls
  rules:
    - host: teleprompt.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: teleprompt-frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: teleprompt-backend-service
                port:
                  number: 5000
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: teleprompt-backend-service
                port:
                  number: 5000
