# nginx do HOST da VM — expõe a API do backend (container na porta 5000) com HTTPS.
# Copiar para /etc/nginx/sites-available/api.teleprompt.zecki1.com.br e rodar
# certbot --nginx -d api.teleprompt.zecki1.com.br (ele adiciona o bloco 443 automaticamente).
server {
    listen 80;
    server_name api.teleprompt.zecki1.com.br;

    # SignalR (websockets) — preflight/negotiate + upgrade
    location /hubs/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # API + qualquer outro caminho do backend
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}